services:
  - type: web
    name: plancraft-genai
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install --include=optional && npm run build
    startCommand: npm run start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22.12.0
      - key: GEMINI_API_KEY
        sync: false
